name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --all-extras --all-groups

    - name: Run ruff
      run: uv run ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true

    - name: Install Pandoc (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y pandoc

    - name: Install Pandoc (macOS)
      if: runner.os == 'macOS'
      uses: tecolicom/actions-use-homebrew-tools@v1
      with:
        tools: pandoc

    - name: Install Pandoc (Windows)
      if: runner.os == 'Windows'
      run: choco install pandoc

    # --all-extras is required: sqlite/excel are extras, not dependency groups.
    # Without it openpyxl/sqlite-utils are missing and ~39 tests silently skip.
    - name: Install dependencies
      run: uv sync --all-extras --all-groups

    - name: Verify optional dependencies are installed
      run: uv run python -c "import openpyxl, sqlite_utils"

    - name: Run tests
      run: uv run pytest tests/ -v --cov=pandoc_embedz --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  # The matrix above always resolves from uv.lock, so it never exercises the
  # dependency ranges real users get from PyPI. These jobs do.
  resolution:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest versions still allowed by our declared floors
          - resolution: lowest-direct
            python-version: '3.11'
          # Newest versions on PyPI today
          - resolution: highest
            python-version: '3.14'

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true

    - name: Install Pandoc
      run: sudo apt-get update && sudo apt-get install -y pandoc

    - name: Resolve dependencies (${{ matrix.resolution }})
      run: uv lock --upgrade --resolution ${{ matrix.resolution }}

    - name: Install dependencies
      run: uv sync --frozen --all-extras --all-groups

    - name: Show resolved versions
      run: uv run --frozen python -c "from importlib.metadata import version; [print(f'{m}=={version(m)}') for m in ['pandas','numpy','jinja2','pyyaml','panflute','openpyxl','sqlite-utils','regex']]"

    - name: Run tests
      run: uv run --frozen pytest tests/ -v
