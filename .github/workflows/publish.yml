name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.0.0
      with:
        enable-cache: true

    - name: Install Pandoc
      run: sudo apt-get update && sudo apt-get install -y pandoc

    # --all-extras is required: sqlite/excel are extras, not dependency groups.
    - name: Install dependencies
      run: uv sync --all-extras --all-groups

    - name: Verify optional dependencies are installed
      run: uv run python -c "import openpyxl, sqlite_utils"

    - name: Run tests
      run: uv run pytest tests/ -v

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.0.0
      with:
        enable-cache: true

    - name: Build package
      run: uv build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
