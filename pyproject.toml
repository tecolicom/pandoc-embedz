[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pandoc-embedz"
version = "0.22.3"
description = "Pandoc filter for embedding data-driven content using Jinja2 templates"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Kazumasa Utashiro"}
]
keywords = ["pandoc", "filter", "jinja2", "data", "template", "markdown"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Filters",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "panflute>=2.0.0",
    "jinja2>=3.0.0",
    # 2.2.2 is the first release compatible with NumPy 2.x
    "pandas>=2.2.2",
    "pyyaml>=6.0",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
sqlite = [
    "sqlite-utils>=3.30",
]
excel = [
    # required by pandas >= 3.0 for reading .xlsx
    "openpyxl>=3.1.5",
]
all = [
    "pandoc-embedz[sqlite,excel]",
]

[project.urls]
Homepage = "https://github.com/tecolicom/pandoc-embedz"
Documentation = "https://github.com/tecolicom/pandoc-embedz#readme"
Repository = "https://github.com/tecolicom/pandoc-embedz"
Issues = "https://github.com/tecolicom/pandoc-embedz/issues"

[project.scripts]
pandoc-embedz = "pandoc_embedz.main:main"

[tool.setuptools]
packages = ["pandoc_embedz"]

[tool.setuptools.package-data]
pandoc_embedz = ["py.typed"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/pandoc-embedz.1"]
"share/man/ja/man1" = ["man/ja/pandoc-embedz.1"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line length is handled by the formatter
]
